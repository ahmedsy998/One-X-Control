name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build One X Control Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Required by AGP 9.1.1 & Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Verify Android SDK Installation & Diagnostics
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "Resolved Android SDK directory: ${SDK_DIR}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "::error::Android SDK directory not found (ANDROID_HOME / ANDROID_SDK_ROOT unset)."
            exit 1
          fi

          echo "sdkmanager path: $(command -v sdkmanager || echo 'NOT FOUND')"
          sdkmanager --version

          REQUIRED_PACKAGES=("platforms;android-36" "build-tools;36.0.0")
          REQUIRED_DIRS=("platforms/android-36" "build-tools/36.0.0")

          for i in "${!REQUIRED_PACKAGES[@]}"; do
            PKG="${REQUIRED_PACKAGES[$i]}"
            DIR="$SDK_DIR/${REQUIRED_DIRS[$i]}"
            if [ ! -d "$DIR" ]; then
              echo "::error::Required Android SDK package missing: ${PKG} (expected directory: ${DIR})"
              echo "Diagnostic command: sdkmanager --install \"${PKG}\""
              echo "Installed SDK root contents:"
              ls -la "$SDK_DIR" || true
              echo "Available SDK repository entries matching platform/build-tools:"
              sdkmanager --list | grep -E 'platforms;android-3|build-tools;3' || true
              exit 1
            fi
          done

          echo "Installed Android SDK packages:"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle Wrapper & Permissions
        run: |
          set -euo pipefail
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not committed in repository; generating Gradle 9.3.1 wrapper..."
            gradle wrapper --gradle-version 9.3.1
          fi
          if [ ! -f "./gradlew" ]; then
            echo "::error::gradlew still missing after wrapper generation."
            exit 1
          fi
          chmod +x ./gradlew
          ls -la ./gradlew gradle/wrapper/

      - name: Validate Gradle Wrapper
        run: ./gradlew --no-daemon --version

      - name: Prepare Debug Signing Keystore
        run: |
          set -euo pipefail
          if [ ! -f "./debug.keystore" ]; then
            if [ -f "./debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d ./debug.keystore.base64 > ./debug.keystore
            else
              echo "Generating standard debug.keystore for debugConfig signing..."
              keytool -genkeypair -v \
                -keystore ./debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          ls -lh ./debug.keystore

      - name: Validate Gradle Project Configuration
        run: ./gradlew --no-daemon :app:tasks --group=build

      - name: Run Unit & Robolectric Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Verify Debug APK Output
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          echo "Checking APK output directory: $APK_DIR"
          if [ ! -d "$APK_DIR" ]; then
            echo "::error::Expected APK output directory not found: $APK_DIR"
            exit 1
          fi
          ls -lh "$APK_DIR"
          APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "::error::No valid non-empty APK found in $APK_DIR"
            exit 1
          fi
          echo "Verified non-empty Debug APK: $APK_FILE"
          sha256sum "$APK_FILE"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: one-x-control-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
